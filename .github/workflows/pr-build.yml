name: PR build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package app (${{ matrix.artifact }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Windows
            executable: dist/Ledgerly/Ledgerly.exe
          - os: ubuntu-22.04
            artifact: Linux
            executable: dist/Ledgerly/Ledgerly
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Linux GUI runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build packaged app
        run: python -m PyInstaller --noconfirm packaging/Ledgerly.spec
      - name: Smoke-test packaged app
        run: python tests/smoke_packaged.py ${{ matrix.executable }}
      - name: Upload packaged app
        uses: actions/upload-artifact@v4
        with:
          name: Ledgerly-PR-${{ github.event.pull_request.number || github.run_number }}-${{ matrix.artifact }}
          path: dist/Ledgerly
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build app
    if: ${{ always() }}
    needs: package
    runs-on: ubuntu-22.04
    steps:
      - name: Require every packaged app to pass
        env:
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: test "$PACKAGE_RESULT" = success
